name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ------------------------------------------------------------------
  # Windows：MinGW-w64 + OpenMP，产物 jieyu.exe / jieyu.dll / libjieyu.dll.a
  # ------------------------------------------------------------------
  windows:
    name: Windows (MinGW + OpenMP)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: 工具链版本
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1
          ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: 测试 1/2 · jieyu test（auto / classic / avx / fma）
        run: |
          set -e
          for isa in auto classic avx fma; do
            echo "================ JIEYU_ISA=$isa ================"
            if [ "$isa" = auto ]; then
              ./resut/jieyu.exe test
            else
              out=$(JIEYU_ISA="$isa" ./resut/jieyu.exe test 2>&1)
              echo "$out"
              echo "$out" | grep -q "JIEYU_ISA=$isa"
            fi
          done

      - name: 缓存测试模型
        uses: actions/cache@v4
        with:
          path: _file/dl
          key: dl-${{ hashFiles('download.json') }}

      - name: 测试 2/2 · CPU 推理（真实模型，多条提示词）
        shell: pwsh
        run: python scripts/ci_infer.py --exe resut/jieyu.exe

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: jieyu-windows-x64
          path: |
            resut/jieyu.exe
            resut/jieyu.dll
            resut/libjieyu.dll.a
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux：GCC + OpenMP（头文件里的 par_for 走 _OPENMP 分支）
  # ------------------------------------------------------------------
  linux:
    name: Linux (GCC + OpenMP)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      - name: 工具链版本
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: 测试 1/2 · jieyu test（auto / classic / avx / fma）
        run: |
          set -e
          for isa in auto classic avx fma; do
            echo "================ JIEYU_ISA=$isa ================"
            if [ "$isa" = auto ]; then
              ./resut/jieyu test
            else
              out=$(JIEYU_ISA="$isa" ./resut/jieyu test 2>&1)
              echo "$out"
              echo "$out" | grep -q "JIEYU_ISA=$isa"
            fi
          done

      - name: 缓存测试模型
        uses: actions/cache@v4
        with:
          path: _file/dl
          key: dl-${{ hashFiles('download.json') }}

      - name: 测试 2/2 · CPU 推理（真实模型，多条提示词）
        run: python3 scripts/ci_infer.py --exe resut/jieyu

      - name: 把推理日志提交回仓库根目录
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infer_log.log
          if git diff --cached --quiet; then
            echo "日志没有变化，不提交"
            exit 0
          fi
          git commit -m "ci: 更新推理日志（1.5B / 3B 输出）[skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: jieyu-linux-x64
          path: |
            resut/jieyu
            resut/jieyu.so
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Zig 交叉编译：x86_64-linux-musl 静态 ELF + .so
  #   这条同时验证「没有 OpenMP 时 parallel.h 的 std::thread 线程池」能编过
  # ------------------------------------------------------------------
  zig-cross:
    name: Zig cross (x86_64-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: 工具链版本
        run: zig version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 交叉编译（静态 ELF + .so）
        run: cmake --build build --target jieyu_linux jieyu_linux_so

      - name: 测试 1/2 · jieyu test（musl + std::thread 池，auto/classic/avx/fma）
        run: |
          set -e
          chmod +x resut/jieyu
          for isa in auto classic avx fma; do
            echo "================ musl JIEYU_ISA=$isa ================"
            if [ "$isa" = auto ]; then
              ./resut/jieyu test
            else
              out=$(JIEYU_ISA="$isa" ./resut/jieyu test 2>&1)
              echo "$out"
              echo "$out" | grep -q "JIEYU_ISA=$isa"
            fi
          done

      - name: 缓存测试模型
        uses: actions/cache@v4
        with:
          path: _file/dl
          key: dl-${{ hashFiles('download.json') }}

      - name: 测试 2/2 · CPU 推理（真实模型，多条提示词）
        run: python3 scripts/ci_infer.py --exe resut/jieyu

      - name: 校验产物
        run: |
          set -e
          test -f resut/jieyu
          test -f resut/jieyu.so
          file resut/jieyu resut/jieyu.so
          # 必须是静态链接的 musl ELF
          ldd resut/jieyu 2>&1 | grep -q "not a dynamic executable" \
            || ldd resut/jieyu 2>&1 | grep -q "statically linked"
          ls -l resut/jieyu resut/jieyu.so

      - name: 上传 musl 产物
        uses: actions/upload-artifact@v4
        with:
          name: jieyu-linux-musl
          path: |
            resut/jieyu
            resut/jieyu.so
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 打 tag（v*）时把三份产物挂到 Release 上
  # ------------------------------------------------------------------
  release:
    name: Release
    needs: [windows, linux, zig-cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 打包
        run: |
          set -e
          cd dist
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -9 -r "../${name}.zip" .)
          done
          ls -l

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          body: |
            自动构建产物（${{ github.ref_name }}）

            - `jieyu-windows-x64.zip`：jieyu.exe / jieyu.dll / libjieyu.dll.a（MinGW-w64 + OpenMP）
            - `jieyu-linux-x64.zip`：jieyu / jieyu.so（GCC + OpenMP）
            - `jieyu-linux-musl.zip`：jieyu / jieyu.so（Zig 交叉编译，静态 musl，std::thread 线程池）
